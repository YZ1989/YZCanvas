name: YZCanvas Windows Preview
on:
  workflow_dispatch:
  push:
    branches: [main, 'work/**']
    paths: ['web/**', 'VERSION', 'CHANGELOG.md', '.github/workflows/desktop-package.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: YZCanvas-Windows-x64-preview
          path: web/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
